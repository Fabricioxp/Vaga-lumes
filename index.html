<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Amor do WhatsApp ❤️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #ec4899;
      --primary-hover: #db2777;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: #fff; }
    p.subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }

    .file-dropzone {
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 30px 20px;
      cursor: pointer;
      background: rgba(236, 72, 153, 0.05);
      transition: all 0.2s ease;
      position: relative;
    }

    .file-dropzone:hover { background: rgba(236, 72, 153, 0.1); }

    input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 25px;
      display: none;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .messages-list {
      margin-top: 30px;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .message-item {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .highlight {
      background-color: rgba(236, 72, 153, 0.25);
      color: #f472b6;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-text { margin-top: 15px; font-weight: 500; color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Contador de Amor ❤️</h1>
      <p class="subtitle">Descubra quantas vezes vocês disseram "te amo" no WhatsApp, inclusive com variações de intensidade!</p>

      <div class="file-dropzone">
        <span id="dropzoneText">📁 Clique ou arraste a conversa exportada (.txt ou .zip)</span>
        <input type="file" id="fileInput" accept=".txt,.zip">
      </div>

      <div id="status" class="status-text"></div>

      <div id="statsGrid" class="stats-grid">
        <div class="stat-card">
          <div id="totalCount" class="stat-number">0</div>
          <div class="stat-label">Total de Declarações</div>
        </div>
      </div>

      <div id="messagesList" class="messages-list"></div>
    </div>
  </div>

  <script>
    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const dropzoneText = document.getElementById('dropzoneText');
      const statsGrid = document.getElementById('statsGrid');
      const messagesList = document.getElementById('messagesList');
      const totalCount = document.getElementById('totalCount');

      dropzoneText.innerText = `📄 ${file.name}`;
      status.innerText = "Analisando histórico...";
      messagesList.innerHTML = "";
      statsGrid.style.display = "none";
      messagesList.style.display = "none";

      try {
        let text = "";

        if (file.name.endsWith('.zip')) {
          const zip = new JSZip();
          const zipContent = await zip.loadAsync(file);
          const txtFile = Object.keys(zipContent.files).find(name => name.endsWith('.txt'));
          
          if (!txtFile) {
            status.innerText = "Nenhum arquivo .txt encontrado dentro do arquivo .zip.";
            return;
          }
          text = await zipContent.files[txtFile].async('string');
        } else {
          text = await file.text();
        }

        // Regex para capturar variações do "te amo" com intensidade estendida
        const regexPattern = /\b(e+u+[\s,]*)?t+e+[\s,]+a+m+o+\b/gi;

        const lines = text.split('\n');
        let matchesCount = 0;
        let htmlList = "";

        lines.forEach(line => {
          if (regexPattern.test(line)) {
            // Conta quantas vezes aparece na mesma linha
            const matchesInLine = line.match(regexPattern);
            if (matchesInLine) matchesCount += matchesInLine.length;

            // Destaca a palavra na linha para exibição visual
            const highlightedText = line.replace(regexPattern, match => `<span class="highlight">${match}</span>`);
            htmlList += `<div class="message-item">${highlightedText}</div>`;
          }
        });

        status.innerText = "";
        totalCount.innerText = matchesCount;
        statsGrid.style.display = "grid";

        if (matchesCount > 0) {
          messagesList.innerHTML = `<h3 style="margin-bottom:15px; font-size:1rem; color:var(--text-muted)">Mensagens encontradas:</h3>` + htmlList;
          messagesList.style.display = "block";
        } else {
          status.innerText = "Nenhuma declaração encontrada com esses padrões.";
        }

      } catch (err) {
        status.innerText = "Erro ao processar o arquivo. Certifique-se de que é um arquivo válido do WhatsApp.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
