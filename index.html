<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Histórico de Amor ❤️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2e;
      --border: #243049;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      /* Roxinho Cósmico (Fabricio) */
      --fabricio-bg: #2d1b4e;
      --fabricio-border: #8b5cf6;
      
      /* Azul Fortinho Van Gogh (Maria) */
      --maria-bg: #1e40af;
      --maria-border: #60a5fa;
      
      --accent-pink: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 800px; width: 100%; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .file-dropzone {
      border: 2px dashed var(--accent-pink);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(236, 72, 153, 0.05);
      position: relative;
      margin-bottom: 20px;
    }

    .file-dropzone:hover { background: rgba(236, 72, 153, 0.1); }

    input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .status-text { text-align: center; font-weight: bold; color: var(--accent-pink); margin-bottom: 15px; }

    /* 1. Contador */
    .counter-section {
      text-align: center;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(30, 64, 175, 0.25));
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: none;
    }

    .counter-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .counter-number { font-size: 2.8rem; font-weight: 800; color: var(--accent-pink); margin: 5px 0; }
    .last-updated { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; font-style: italic; }

    /* Estilos Gerais de Cabeçalho de Seção */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title { font-size: 0.95rem; font-weight: bold; color: var(--text-muted); }

    .btn-fullscreen {
      background: var(--border);
      border: none;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .btn-fullscreen:hover { background: var(--accent-pink); }

    /* 2. Caixinha "Te Amo" */
    .highlights-box {
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      display: none;
    }

    .highlights-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
    }

    /* Modo Fullscreen Unificado */
    .fullscreen-mode {
      position: fixed !important;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: var(--bg-color) !important;
      border-radius: 0 !important;
      padding: 20px !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column;
      gap: 12px;
    }

    .fullscreen-mode .highlights-list,
    .fullscreen-mode .chat-feed {
      max-height: none !important;
      height: 100% !important;
      flex: 1;
    }

    /* 3. Área do Chat Completo + Controles Integrados */
    .chat-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .chat-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .search-row { display: flex; gap: 10px; align-items: center; position: relative; }
    
    .input-wrapper { position: relative; flex: 1; }
    .input-wrapper input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-color);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.6; }

    .date-row { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; }
    .date-row input {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Menu Popover de Tags Otimizado */
    .tags-container { position: relative; }

    .tag-menu-btn {
      background: var(--border);
      border: none;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tag-menu-btn:hover { background: var(--accent-pink); }

    .tags-popover {
      display: none;
      position: absolute;
      top: 110%;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      z-index: 1000;
      width: 260px;
    }

    .tags-popover.active { display: grid; }

    .tag-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: left;
    }
    .tag-item:hover { background: var(--accent-pink); color: #fff; }

    /* 4. Feed de Mensagens */
    .chat-feed {
      height: 500px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(11, 15, 25, 0.5);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .msg-fabricio {
      align-self: flex-end;
      background-color: var(--fabricio-bg);
      border: 1px solid var(--fabricio-border);
      border-bottom-right-radius: 2px;
    }

    .msg-maria {
      align-self: flex-start;
      background-color: var(--maria-bg);
      border: 1px solid var(--maria-border);
      border-bottom-left-radius: 2px;
    }

    .msg-other {
      align-self: center;
      background-color: #1e293b;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .msg-header {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      opacity: 0.85;
    }

    .highlight {
      background-color: rgba(236, 72, 153, 0.45);
      color: #fff;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .load-more-btn {
      background: var(--border);
      color: var(--text-main);
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
      font-size: 0.85rem;
      align-self: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="file-dropzone">
        <span id="dropzoneText">📁 Selecione a conversa do WhatsApp (.txt ou .zip)</span>
        <input type="file" id="fileInput" accept=".txt,.zip">
      </div>

      <div id="status" class="status-text"></div>

      <!-- 1. Contador -->
      <div id="counterSection" class="counter-section">
        <div class="counter-title">Vezes Aproximadas que dissemos "Te Amo" ❤️</div>
        <div id="counterNumber" class="counter-number">0</div>
        <div id="lastUpdated" class="last-updated"></div>
      </div>

      <!-- 2. Caixinha "Te Amo" -->
      <div id="highlightsBox" class="highlights-box">
        <div class="section-header">
          <div class="section-title">💖 Declarações Encontradas no Histórico:</div>
          <button class="btn-fullscreen" onclick="toggleFullscreen('highlightsBox')">⛶ Tela Cheia</button>
        </div>
        <div id="highlightsList" class="highlights-list"></div>
      </div>

      <!-- 3. Seção do Chat Completo (Com Lupa e Controles Inclusos no Fullscreen) -->
      <div id="chatSection" class="chat-section">
        <div class="section-header">
          <div class="section-title">💬 Histórico Completo de Conversas:</div>
          <button class="btn-fullscreen" onclick="toggleFullscreen('chatSection')">⛶ Tela Cheia</button>
        </div>

        <div class="chat-controls">
          <div class="search-row">
            <div class="input-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchInput" placeholder="Pesquisar termo no chat...">
            </div>

            <div class="tags-container">
              <button class="tag-menu-btn" onclick="toggleTagsMenu(event)">🏷️ Tags <span style="font-size:0.7rem">▼</span></button>
              <div id="tagsPopover" class="tags-popover">
                <button class="tag-item" onclick="applyTag('te amo')">❤️ Te Amo</button>
                <button class="tag-item" onclick="applyTag('saudade')">🥺 Saudades</button>
                <button class="tag-item" onclick="applyTag('bom dia')">☀️ Bom dia</button>
                <button class="tag-item" onclick="applyTag('boa noite')">🌙 Boa noite</button>
                <button class="tag-item" onclick="applyTag('meu amor')">💖 Meu Amor</button>
                <button class="tag-item" onclick="applyTag('vida')">🥰 Vida</button>
                <button class="tag-item" onclick="applyTag('linda')">😍 Linda/o</button>
                <button class="tag-item" onclick="applyTag('beijo')">😘 Beijos</button>
                <button class="tag-item" onclick="applyTag('sonho')">✨ Sonho</button>
                <button class="tag-item" onclick="applyTag('fome')">🍕 Fome</button>
              </div>
            </div>
          </div>

          <div class="date-row">
            <label>De: <input type="date" id="dateStart"></label>
            <label>Até: <input type="date" id="dateEnd"></label>
            <button class="btn-fullscreen" style="margin-left:auto" onclick="clearFilters()">🔄 Limpar</button>
          </div>
        </div>

        <div id="chatFeed" class="chat-feed"></div>
      </div>

    </div>
  </div>

  <script>
    let parsedMessages = [];
    let filteredMessages = [];
    let currentPage = 1;
    const PAGE_SIZE = 100;

    const patternTE_AMO = /\b(?:e+u+[\s,]*)?t+e+[\s,]+a+m+o+\b/gi;
    const patternAMO_VOCE = /\ba+m+o+[\s,]+(?:v+o+c+e+|v+c+)\b/gi;
    const masterLoveRegex = new RegExp(`${patternTE_AMO.source}|${patternAMO_VOCE.source}`, 'gi');

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      document.getElementById('dropzoneText').innerText = `📄 ${file.name}`;
      status.innerText = "Processando arquivo...";

      setTimeout(async () => {
        try {
          let text = "";
          if (file.name.endsWith('.zip')) {
            const zip = new JSZip();
            const zipContent = await zip.loadAsync(file);
            const txtFile = Object.keys(zipContent.files).find(name => name.endsWith('.txt'));
            if (!txtFile) {
              status.innerText = "Arquivo .txt não encontrado no .zip.";
              return;
            }
            text = await zipContent.files[txtFile].async('string');
          } else {
            text = await file.text();
          }

          parseWhatsAppText(text);
          renderDashboard();
          
          const now = new Date();
          const dateFormatted = now.toLocaleDateString('pt-BR');
          const timeFormatted = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          document.getElementById('lastUpdated').innerText = `Histórico carregado em ${dateFormatted} às ${timeFormatted}`;
          
          status.innerText = "";
        } catch (err) {
          status.innerText = "Erro ao processar o arquivo.";
          console.error(err);
        }
      }, 50);
    });

    function parseWhatsAppText(text) {
      parsedMessages = [];
      const lines = text.split('\n');
      const msgRegex = /^\[?(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s(\d{1,2}:\d{2}(?::\d{2})?)\]?\s-?\s?([^:]+):\s(.*)$/;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(msgRegex);
        if (match) {
          const dateParts = match[1].split('/');
          let isoDate = "";
          if (dateParts.length === 3) {
            let year = dateParts[2].length === 2 ? '20' + dateParts[2] : dateParts[2];
            let month = dateParts[1].padStart(2, '0');
            let day = dateParts[0].padStart(2, '0');
            isoDate = `${year}-${month}-${day}`;
          }

          parsedMessages.push({
            date: isoDate,
            dateRaw: match[1],
            time: match[2],
            author: match[3].trim(),
            content: match[4].trim()
          });
        } else if (parsedMessages.length > 0) {
          parsedMessages[parsedMessages.length - 1].content += "\n" + line.trim();
        }
      }
    }

    function renderDashboard() {
      let loveCount = 0;
      const loveMessages = [];

      parsedMessages.forEach(msg => {
        const matches = msg.content.match(masterLoveRegex);
        if (matches) {
          loveCount += matches.length;
          loveMessages.push(msg);
        }
      });

      document.getElementById('counterNumber').innerText = loveCount;
      document.getElementById('counterSection').style.display = 'block';

      const highlightsList = document.getElementById('highlightsList');
      highlightsList.innerHTML = "";
      
      loveMessages.forEach(msg => {
        const highlightedContent = msg.content.replace(masterLoveRegex, match => `<span class="highlight">${match}</span>`);
        const item = document.createElement('div');
        item.className = `msg-bubble ${getAuthorClass(msg.author)}`;
        item.innerHTML = `
          <div class="msg-header">
            <span>${escapeHTML(msg.author)}</span>
            <span>${msg.dateRaw} ${msg.time}</span>
          </div>
          <div>${highlightedContent}</div>
        `;
        highlightsList.appendChild(item);
      });
      
      document.getElementById('highlightsBox').style.display = 'block';
      document.getElementById('chatSection').style.display = 'flex';
      
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const dateStart = document.getElementById('dateStart').value;
      const dateEnd = document.getElementById('dateEnd').value;

      filteredMessages = parsedMessages.filter(msg => {
        let matchesText = true;
        if (searchTerm) {
          if (searchTerm === 'te amo') {
            matchesText = masterLoveRegex.test(msg.content);
          } else {
            matchesText = msg.content.toLowerCase().includes(searchTerm);
          }
        }

        let matchesDate = true;
        if (dateStart && msg.date < dateStart) matchesDate = false;
        if (dateEnd && msg.date > dateEnd) matchesDate = false;

        return matchesText && matchesDate;
      });

      currentPage = 1;
      const chatFeed = document.getElementById('chatFeed');
      chatFeed.innerHTML = "";
      renderPage();
    }

    function renderPage() {
      const chatFeed = document.getElementById('chatFeed');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = currentPage * PAGE_SIZE;
      const pageItems = filteredMessages.slice(start, end);

      const oldButton = document.getElementById('loadMoreBtn');
      if (oldButton) oldButton.remove();

      pageItems.forEach(msg => {
        const item = document.createElement('div');
        item.className = `msg-bubble ${getAuthorClass(msg.author)}`;
        
        let displayContent = escapeHTML(msg.content);
        if (searchTerm && searchTerm !== 'te amo') {
          const searchRegex = new RegExp(`(${escapeRegExp(searchTerm)})`, 'gi');
          displayContent = displayContent.replace(searchRegex, `<span class="highlight">$1</span>`);
        } else if (searchTerm === 'te amo') {
          displayContent = displayContent.replace(masterLoveRegex, match => `<span class="highlight">${match}</span>`);
        }

        item.innerHTML = `
          <div class="msg-header">
            <span>${escapeHTML(msg.author)}</span>
            <span>${msg.dateRaw} ${msg.time}</span>
          </div>
          <div>${displayContent}</div>
        `;
        chatFeed.appendChild(item);
      });

      if (end < filteredMessages.length) {
        const btn = document.createElement('button');
        btn.id = 'loadMoreBtn';
        btn.className = 'load-more-btn';
        btn.innerText = `Carregar mais mensagens (${filteredMessages.length - end} restantes)`;
        btn.onclick = () => {
          currentPage++;
          renderPage();
        };
        chatFeed.appendChild(btn);
      }
    }

    function toggleFullscreen(elementId) {
      const el = document.getElementById(elementId);
      el.classList.toggle('fullscreen-mode');
    }

    function toggleTagsMenu(e) {
      e.stopPropagation();
      const popover = document.getElementById('tagsPopover');
      popover.classList.toggle('active');
    }

    document.addEventListener('click', () => {
      document.getElementById('tagsPopover').classList.remove('active');
    });

    function applyTag(tag) {
      document.getElementById('searchInput').value = tag;
      document.getElementById('tagsPopover').classList.remove('active');
      applyFilters();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = "";
      document.getElementById('dateStart').value = "";
      document.getElementById('dateEnd').value = "";
      applyFilters();
    }

    function getAuthorClass(author) {
      const name = author.toLowerCase();
      if (name.includes('fabricio') || name.includes('fabrício')) return 'msg-fabricio';
      if (name.includes('maria')) return 'msg-maria';
      return 'msg-other';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('dateStart').addEventListener('change', applyFilters);
    document.getElementById('dateEnd').addEventListener('change', applyFilters);
  </script>

</body>
</html>
