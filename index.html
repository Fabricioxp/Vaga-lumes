<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Conversas do WhatsApp 🔍❤️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #ec4899;
      --primary-hover: #db2777;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: #fff; }
    p.subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }

    .file-dropzone {
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 25px 20px;
      cursor: pointer;
      background: rgba(236, 72, 153, 0.05);
      position: relative;
      margin-bottom: 20px;
    }

    .file-dropzone:hover { background: rgba(236, 72, 153, 0.1); }

    input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      display: none;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .search-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background-color: var(--primary-hover);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 25px;
      display: none;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .messages-list {
      margin-top: 25px;
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }

    .message-item {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .highlight {
      background-color: rgba(236, 72, 153, 0.35);
      color: #f472b6;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-text { margin-top: 15px; font-weight: 500; color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Lupa do Amor 🔍❤️</h1>
      <p class="subtitle">Faça upload da conversa e busque por declarações de amor com qualquer variação de intensidade!</p>

      <div class="file-dropzone">
        <span id="dropzoneText">📁 Selecione a conversa exportada (.txt ou .zip)</span>
        <input type="file" id="fileInput" accept=".txt,.zip">
      </div>

      <div id="searchBox" class="search-box">
        <div class="input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" value="eu te amo" placeholder="Digite o termo de busca...">
        </div>
        <button id="searchBtn" class="search-btn">Buscar</button>
      </div>

      <div id="status" class="status-text"></div>

      <div id="statsGrid" class="stats-grid">
        <div class="stat-card">
          <div id="totalCount" class="stat-number">0</div>
          <div class="stat-label">Declarações Encontradas</div>
        </div>
      </div>

      <div id="messagesList" class="messages-list"></div>
    </div>
  </div>

  <script>
    let rawTextContent = "";

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const dropzoneText = document.getElementById('dropzoneText');
      const searchBox = document.getElementById('searchBox');

      dropzoneText.innerText = `📄 ${file.name}`;
      status.innerText = "Carregando histórico...";

      try {
        if (file.name.endsWith('.zip')) {
          const zip = new JSZip();
          const zipContent = await zip.loadAsync(file);
          const txtFile = Object.keys(zipContent.files).find(name => name.endsWith('.txt'));
          
          if (!txtFile) {
            status.innerText = "Nenhum arquivo .txt encontrado no .zip.";
            return;
          }
          rawTextContent = await zipContent.files[txtFile].async('string');
        } else {
          rawTextContent = await file.text();
        }

        status.innerText = "Arquivo carregado! Clique na lupa para buscar.";
        searchBox.style.display = "flex";
        performSearch();

      } catch (err) {
        status.innerText = "Erro ao carregar o arquivo.";
        console.error(err);
      }
    });

    document.getElementById('searchBtn').addEventListener('click', performSearch);
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') performSearch();
    });

    function performSearch() {
      if (!rawTextContent) return;

      const query = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      const statsGrid = document.getElementById('statsGrid');
      const messagesList = document.getElementById('messagesList');
      const totalCount = document.getElementById('totalCount');

      if (!query) {
        status.innerText = "Digite algo na barra de pesquisa.";
        return;
      }

      status.innerText = "Pesquisando...";
      messagesList.innerHTML = "";

      let regexPattern;
      const queryLower = query.toLowerCase();

      // Se a busca contiver termos comuns de amor, ativa a captura universal de intensidade
      if (queryLower.includes('amo') || queryLower.includes('te')) {
        // Padrão que aceita:
        // (opcional): e+u+ (euuu, eeeuu, etc)
        // t+e+ (teee, ttte, etc)
        // a+m+o+ (amooo, aammmooo, etc)
        regexPattern = /(?:[eéèé]+[uú]+[\s,]*)?[tT]+[eéèé]+[\s,]+[aáàâãá]+[mM]+[oóòôõó]+/gi;
      } else {
        regexPattern = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      }

      const lines = rawTextContent.split('\n');
      let matchesCount = 0;
      let htmlList = "";

      lines.forEach(line => {
        const matchesInLine = line.match(regexPattern);
        if (matchesInLine) {
          matchesCount += matchesInLine.length;
          const highlightedText = line.replace(regexPattern, match => `<span class="highlight">${match}</span>`);
          htmlList += `<div class="message-item">${highlightedText}</div>`;
        }
      });

      status.innerText = "";
      totalCount.innerText = matchesCount;
      statsGrid.style.display = "grid";

      if (matchesCount > 0) {
        messagesList.innerHTML = `<h3 style="margin-bottom:15px; font-size:1rem; color:var(--text-muted)">Todas as variações encontradas:</h3>` + htmlList;
        messagesList.style.display = "block";
      } else {
        messagesList.style.display = "none";
        status.innerText = `Nenhum resultado encontrado para "${query}".`;
      }
    }
  </script>

</body>
</html>
