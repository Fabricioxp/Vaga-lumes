<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Histórico de Amor ❤️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --primary: #8c625d;
      --secondary: #a68580;
      --border-color: #e6b3a8;
      --bg-card: #ffffff;
      --text-color: #4a3e3d;
      --text-muted: #8a7573;
      --bg-main: #fff3f2;
      --fabricio-bg: #f5e8e6;
      --fabricio-border: #d4a39b;
      --maria-bg: #1e40af;
      --maria-border: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-color);
      padding: 16px;
      padding-top: 30px;
      display: flex;
      justify-content: center;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 800px; width: 100%; }
    .card {
      background-color: var(--bg-card);
      border: 1px solid rgba(230, 179, 168, 0.4);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(140, 98, 93, 0.12);
    }
    .file-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fffbfb;
      position: relative;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .file-dropzone:hover { background: #fdf5f4; border-color: var(--primary); }
    input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .cloud-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-cloud {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-cloud:hover { background-color: #734f4b; }
    .btn-cloud-danger { background-color: #d9534f; }
    .btn-cloud-danger:hover { background-color: #c9302c; }
    .status-text { text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 15px; }
    .counter-section {
      text-align: center;
      background: linear-gradient(135deg, rgba(230, 179, 168, 0.25), rgba(140, 98, 93, 0.1));
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: none;
    }
    .counter-title { font-size: 0.85rem; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
    .counter-number { font-size: 2.8rem; font-weight: 800; color: var(--primary); margin: 5px 0; }
    .last-updated { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; font-style: italic; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 0.95rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-fullscreen {
      background: #fff; border: 1px solid var(--border-color); color: var(--primary);
      padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 4px; font-weight: bold; transition: all 0.2s;
    }
    .btn-fullscreen:hover { background: var(--primary); color: #fff; }
    .highlights-box {
      border: 1px solid rgba(230, 179, 168, 0.5); background: #fffbfb; border-radius: 14px;
      padding: 15px; margin-bottom: 20px; display: none;
    }
    .highlights-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
    .fullscreen-mode {
      position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
      background: var(--bg-main) !important; border-radius: 0 !important; padding: 20px !important;
      margin: 0 !important; display: flex !important; flex-direction: column; gap: 12px;
    }
    .fullscreen-mode .highlights-list, .fullscreen-mode .chat-feed { max-height: none !important; height: 100% !important; flex: 1; }
    .chat-section { display: none; flex-direction: column; gap: 12px; }
    .chat-controls { display: flex; flex-direction: column; gap: 12px; background: #fffbfb; padding: 14px; border-radius: 14px; border: 1px solid var(--border-color); }
    .search-row { display: flex; gap: 10px; align-items: center; position: relative; }
    .input-wrapper { position: relative; flex: 1; }
    .input-wrapper input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid rgba(230, 179, 168, 0.6); background: #ffffff; color: var(--text-color); font-size: 0.9rem; outline: none; }
    .input-wrapper input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.6; }
    .date-row { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; color: var(--secondary); flex-wrap: wrap; }
    .date-row input { background: #ffffff; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 10px; border-radius: 8px; }
    .tags-container { position: relative; }
    .tag-menu-btn { background: #ffffff; border: 1px solid var(--border-color); color: var(--primary); padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .tag-menu-btn:hover { background: var(--primary); color: #fff; }
    .tags-popover { display: none; position: absolute; top: 110%; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; box-shadow: 0 10px 25px rgba(140, 98, 93, 0.18); grid-template-columns: repeat(2, 1fr); gap: 8px; z-index: 1000; width: 260px; }
    .tags-popover.active { display: grid; }
    .tag-item { background: #fffbfb; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; text-align: left; }
    .tag-item:hover { background: var(--primary); color: #fff; }
    .chat-feed { height: 500px; overflow-y: auto; padding: 12px; background: #fffbfb; border-radius: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
    .msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; }
    .msg-fabricio { align-self: flex-end; background-color: var(--fabricio-bg); border: 1px solid var(--fabricio-border); color: var(--text-color); border-bottom-right-radius: 2px; }
    .msg-maria { align-self: flex-start; background-color: var(--maria-bg); border: 1px solid var(--maria-border); color: #ffffff; border-bottom-left-radius: 2px; }
    .msg-other { align-self: center; background-color: #f1e4e2; border: 1px solid var(--border-color); font-size: 0.8rem; color: var(--secondary); }
    .msg-header { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; opacity: 0.9; }
    .highlight { background-color: rgba(230, 179, 168, 0.6); color: #000; font-weight: bold; padding: 1px 4px; border-radius: 3px; }
    .load-more-btn { background: var(--primary); color: #ffffff; border: none; padding: 10px 18px; border-radius: 12px; cursor: pointer; margin: 10px 0; font-size: 0.85rem; font-weight: bold; align-self: center; transition: background 0.2s; }
    .load-more-btn:hover { background: #734f4b; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="file-dropzone" id="dropzoneBox">
        <span id="dropzoneText">📁 Selecione a conversa do WhatsApp (.txt ou .zip)</span>
        <input type="file" id="fileInput" accept=".txt,.zip">
      </div>

      <div class="cloud-actions">
        <button id="btnSaveCloud" class="btn-cloud" style="display: none;">☁️ Salvar Histórico na Nuvem</button>
        <button id="btnDeleteCloud" class="btn-cloud btn-cloud-danger" style="display: none;">🗑️ Excluir Histórico</button>
      </div>

      <div id="status" class="status-text"></div>

      <div id="counterSection" class="counter-section">
        <div class="counter-title">Vezes Aproximadas que dissemos "Te Amo" ❤️</div>
        <div id="counterNumber" class="counter-number">0</div>
        <div id="lastUpdated" class="last-updated"></div>
      </div>

      <div id="highlightsBox" class="highlights-box">
        <div class="section-header">
          <div class="section-title">💖 Declarações Encontradas no Histórico:</div>
          <button class="btn-fullscreen" onclick="toggleFullscreen('highlightsBox')">⛶ Tela Cheia</button>
        </div>
        <div id="highlightsList" class="highlights-list"></div>
      </div>

      <div id="chatSection" class="chat-section">
        <div class="section-header">
          <div class="section-title">💬 Histórico Completo de Conversas:</div>
          <button class="btn-fullscreen" onclick="toggleFullscreen('chatSection')">⛶ Tela Cheia</button>
        </div>

        <div class="chat-controls">
          <div class="search-row">
            <div class="input-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchInput" placeholder="Pesquisar termo no chat...">
            </div>

            <div class="tags-container">
              <button class="tag-menu-btn" onclick="toggleTagsMenu(event)">🏷️ Tags <span style="font-size:0.7rem">▼</span></button>
              <div id="tagsPopover" class="tags-popover">
                <button class="tag-item" onclick="applyTag('te amo')">❤️ Te Amo</button>
                <button class="tag-item" onclick="applyTag('saudade')">🥺 Saudades</button>
                <button class="tag-item" onclick="applyTag('bom dia')">☀️ Bom dia</button>
                <button class="tag-item" onclick="applyTag('boa noite')">🌙 Boa noite</button>
                <button class="tag-item" onclick="applyTag('meu amor')">💖 Meu Amor</button>
                <button class="tag-item" onclick="applyTag('vida')">🥰 Vida</button>
                <button class="tag-item" onclick="applyTag('linda')">😍 Linda/o</button>
                <button class="tag-item" onclick="applyTag('beijo')">😘 Beijos</button>
                <button class="tag-item" onclick="applyTag('sonho')">✨ Sonho</button>
                <button class="tag-item" onclick="applyTag('fome')">🍕 Fome</button>
              </div>
            </div>
          </div>

          <div class="date-row">
            <label>De: <input type="date" id="dateStart"></label>
            <label>Até: <input type="date" id="dateEnd"></label>
            <button class="btn-fullscreen" style="margin-left:auto" onclick="clearFilters()">🔄 Limpar</button>
          </div>
        </div>

        <div id="chatFeed" class="chat-feed"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // COLE AQUI O CONFIG DO SEU NOVO PROJETO
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "seu-projeto",
      storageBucket: "seu-projeto.firebasestorage.app",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let parsedMessages = [];
    let filteredMessages = [];
    let currentPage = 1;
    const PAGE_SIZE = 100;
    let rawFileText = "";
    let currentFileName = "";

    const patternTE_AMO = /\b(?:e+u+[\s,]*)?t+e+[\s,]+a+m+o+\b/gi;
    const patternAMO_VOCE = /\ba+m+o+[\s,]+(?:v+o+c+e+|v+c+)\b/gi;
    const masterLoveRegex = new RegExp(`${patternTE_AMO.source}|${patternAMO_VOCE.source}`, 'gi');

    const statusEl = document.getElementById('status');
    const btnSaveCloud = document.getElementById('btnSaveCloud');
    const btnDeleteCloud = document.getElementById('btnDeleteCloud');

    window.addEventListener('DOMContentLoaded', async () => {
      checkCloudHistory();
    });

    async function checkCloudHistory() {
      try {
        statusEl.innerText = "Verificando se há histórico na nuvem...";
        
        const mainDoc = await getDoc(doc(db, "historico_info", "meta"));

        if (mainDoc.exists()) {
          const meta = mainDoc.data();
          statusEl.innerText = "Baixando histórico da nuvem...";

          const querySnapshot = await getDocs(collection(db, "historico_partes"));
          const chunks = [];
          
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            chunks[data.index] = data.text;
          });

          rawFileText = chunks.join("");
          currentFileName = meta.fileName;

          parseWhatsAppText(rawFileText);
          renderDashboard();

          document.getElementById('dropzoneText').innerText = `☁️ Histórico Ativo: ${meta.fileName}`;
          document.getElementById('lastUpdated').innerText = `Histórico carregado da nuvem (${meta.dataSalvamento || 'Anteriormente'})`;
          
          btnDeleteCloud.style.display = "inline-block";
          btnSaveCloud.style.display = "none";
          statusEl.innerText = "";
        } else {
          statusEl.innerText = "";
        }
      } catch (err) {
        console.error("Erro ao carregar nuvem:", err);
        statusEl.innerText = "";
      }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      currentFileName = file.name;
      document.getElementById('dropzoneText').innerText = `📄 ${file.name}`;
      statusEl.innerText = "Processando arquivo...";

      setTimeout(async () => {
        try {
          if (file.name.endsWith('.zip')) {
            const zip = new JSZip();
            const zipContent = await zip.loadAsync(file);
            const txtFile = Object.keys(zipContent.files).find(name => name.endsWith('.txt'));
            if (!txtFile) {
              statusEl.innerText = "Arquivo .txt não encontrado no .zip.";
              return;
            }
            rawFileText = await zipContent.files[txtFile].async('string');
          } else {
            rawFileText = await file.text();
          }

          parseWhatsAppText(rawFileText);
          renderDashboard();
          
          const now = new Date();
          const dateFormatted = now.toLocaleDateString('pt-BR');
          const timeFormatted = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          document.getElementById('lastUpdated').innerText = `Arquivo local aberto em ${dateFormatted} às ${timeFormatted}`;
          
          btnSaveCloud.style.display = "inline-block";
          statusEl.innerText = "";
        } catch (err) {
          statusEl.innerText = "Erro ao processar o arquivo.";
          console.error(err);
        }
      }, 50);
    });

    // Salva dividindo em partes menores no Firestore
    btnSaveCloud.addEventListener('click', async () => {
      if (!rawFileText) return;
      try {
        statusEl.innerText = "Salvando arquivo na nuvem...";
        btnSaveCloud.disabled = true;

        // Limpa partes antigas primeiro
        await clearCloudData();

        const now = new Date();
        const dataSalvamento = `${now.toLocaleDateString('pt-BR')} às ${now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;

        // Divide o texto em blocos de 300 mil caracteres (~300KB cada)
        const CHUNK_SIZE = 300000;
        let index = 0;
        
        for (let i = 0; i < rawFileText.length; i += CHUNK_SIZE) {
          const chunk = rawFileText.substring(i, i + CHUNK_SIZE);
          await setDoc(doc(db, "historico_partes", `parte_${index}`), {
            index: index,
            text: chunk
          });
          index++;
        }

        // Salva metadados
        await setDoc(doc(db, "historico_info", "meta"), {
          fileName: currentFileName,
          dataSalvamento: dataSalvamento,
          totalParts: index
        });

        alert("Histórico salvo na nuvem com sucesso! ❤️");
        btnSaveCloud.style.display = "none";
        btnDeleteCloud.style.display = "inline-block";
        statusEl.innerText = "";
      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao salvar no Firestore. Verifique as Regras do Firestore.");
        statusEl.innerText = "";
      } finally {
        btnSaveCloud.disabled = false;
      }
    });

    async function clearCloudData() {
      const querySnapshot = await getDocs(collection(db, "historico_partes"));
      const batch = writeBatch(db);
      querySnapshot.forEach((d) => batch.delete(d.ref()));
      await batch.commit();
      await deleteDoc(doc(db, "historico_info", "meta")).catch(() => {});
    }

    btnDeleteCloud.addEventListener('click', async () => {
      const pinDigitado = prompt("⚠️ Para excluir o histórico da nuvem, digite o PIN:");
      if (pinDigitado !== "1566") {
        if (pinDigitado !== null) alert("PIN incorreto!");
        return;
      }

      try {
        statusEl.innerText = "Excluindo...";
        await clearCloudData();
        alert("Histórico excluído!");
        location.reload();
      } catch (err) {
        alert("Erro ao excluir.");
      }
    });

    function parseWhatsAppText(text) {
      parsedMessages = [];
      const lines = text.split('\n');
      const msgRegex = /^\[?(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[AP]M)?)\]?\s*(?:-|\|)?\s*([^:]+):\s*(.*)$/i;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(msgRegex);

        if (match) {
          const content = match[4].trim();
          if (/<mídia\s+oculta>|<arquivo\s+de\s+mídia\s+oculto>|<media\s+omitted>/gi.test(content)) continue;

          const dateParts = match[1].split(/[\/\.-]/);
          let isoDate = "";
          if (dateParts.length === 3) {
            let year = dateParts[2].length === 2 ? '20' + dateParts[2] : dateParts[2];
            let month = dateParts[1].padStart(2, '0');
            let day = dateParts[0].padStart(2, '0');
            isoDate = `${year}-${month}-${day}`;
          }

          parsedMessages.push({
            date: isoDate, dateRaw: match[1], time: match[2],
            author: match[3].trim(), content: content
          });
        } else if (parsedMessages.length > 0) {
          const extraLine = line.trim();
          if (extraLine && !/<mídia\s+oculta>|<arquivo\s+de\s+mídia\s+oculto>|<media\s+omitted>/gi.test(extraLine)) {
            parsedMessages[parsedMessages.length - 1].content += "\n" + extraLine;
          }
        }
      }
    }

    function renderDashboard() {
      let loveCount = 0; const loveMessages = [];

      parsedMessages.forEach(msg => {
        const matches = msg.content.match(masterLoveRegex);
        if (matches) { loveCount += matches.length; loveMessages.push(msg); }
      });

      document.getElementById('counterNumber').innerText = loveCount;
      document.getElementById('counterSection').style.display = 'block';

      const highlightsList = document.getElementById('highlightsList');
      highlightsList.innerHTML = "";
      
      loveMessages.forEach(msg => {
        const highlightedContent = msg.content.replace(masterLoveRegex, match => `<span class="highlight">${match}</span>`);
        const item = document.createElement('div');
        item.className = `msg-bubble ${getAuthorClass(msg.author)}`;
        item.innerHTML = `<div class="msg-header"><span>${escapeHTML(msg.author)}</span><span>${msg.dateRaw} ${msg.time}</span></div><div>${highlightedContent}</div>`;
        highlightsList.appendChild(item);
      });
      
      document.getElementById('highlightsBox').style.display = 'block';
      document.getElementById('chatSection').style.display = 'flex';
      
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const dateStart = document.getElementById('dateStart').value;
      const dateEnd = document.getElementById('dateEnd').value;

      filteredMessages = parsedMessages.filter(msg => {
        let matchesText = true;
        if (searchTerm) { matchesText = (searchTerm === 'te amo') ? masterLoveRegex.test(msg.content) : msg.content.toLowerCase().includes(searchTerm); }
        let matchesDate = true;
        if (dateStart && msg.date < dateStart) matchesDate = false;
        if (dateEnd && msg.date > dateEnd) matchesDate = false;
        return matchesText && matchesDate;
      });

      currentPage = 1;
      document.getElementById('chatFeed').innerHTML = "";
      renderPage();
    }

    function renderPage() {
      const chatFeed = document.getElementById('chatFeed');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = currentPage * PAGE_SIZE;
      const pageItems = filteredMessages.slice(start, end);

      const oldButton = document.getElementById('loadMoreBtn');
      if (oldButton) oldButton.remove();

      pageItems.forEach(msg => {
        const item = document.createElement('div');
        item.className = `msg-bubble ${getAuthorClass(msg.author)}`;
        
        let displayContent = escapeHTML(msg.content);
        if (searchTerm && searchTerm !== 'te amo') {
          const searchRegex = new RegExp(`(${escapeRegExp(searchTerm)})`, 'gi');
          displayContent = displayContent.replace(searchRegex, `<span class="highlight">$1</span>`);
        } else if (searchTerm === 'te amo') {
          displayContent = displayContent.replace(masterLoveRegex, match => `<span class="highlight">${match}</span>`);
        }

        item.innerHTML = `<div class="msg-header"><span>${escapeHTML(msg.author)}</span><span>${msg.dateRaw} ${msg.time}</span></div><div>${displayContent}</div>`;
        chatFeed.appendChild(item);
      });

      if (end < filteredMessages.length) {
        const btn = document.createElement('button');
        btn.id = 'loadMoreBtn'; btn.className = 'load-more-btn';
        btn.innerText = `Carregar mais mensagens (${filteredMessages.length - end} restantes)`;
        btn.onclick = () => { currentPage++; renderPage(); };
        chatFeed.appendChild(btn);
      }
    }

    window.toggleFullscreen = function(elementId) { document.getElementById(elementId).classList.toggle('fullscreen-mode'); };
    window.toggleTagsMenu = function(e) { e.stopPropagation(); document.getElementById('tagsPopover').classList.toggle('active'); };
    document.addEventListener('click', () => { const p = document.getElementById('tagsPopover'); if (p) p.classList.remove('active'); });
    window.applyTag = function(tag) { document.getElementById('searchInput').value = tag; document.getElementById('tagsPopover').classList.remove('active'); applyFilters(); };
    window.clearFilters = function() { document.getElementById('searchInput').value = ""; document.getElementById('dateStart').value = ""; document.getElementById('dateEnd').value = ""; applyFilters(); };

    function getAuthorClass(author) {
      const name = author.toLowerCase();
      if (name.includes('fabricio') || name.includes('fabrício')) return 'msg-fabricio';
      if (name.includes('maria')) return 'msg-maria';
      return 'msg-other';
    }

    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('dateStart').addEventListener('change', applyFilters);
    document.getElementById('dateEnd').addEventListener('change', applyFilters);
  </script>
</body>
