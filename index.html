<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Amor do WhatsApp ❤️</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container { max-width: 650px; width: 100%; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: #fff; }
    p.subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }

    .file-dropzone {
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 30px 20px;
      cursor: pointer;
      background: rgba(236, 72, 153, 0.05);
      position: relative;
    }

    .file-dropzone:hover { background: rgba(236, 72, 153, 0.1); }

    input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .status-text { margin-top: 15px; font-weight: 500; color: var(--primary); }

    .results-container { margin-top: 30px; display: none; }

    .stat-card {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(30, 41, 59, 0.6));
      border: 1px solid var(--primary);
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 25px;
    }

    .stat-number { font-size: 3rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.95rem; color: var(--text-main); margin-top: 4px; }

    .messages-list {
      text-align: left;
      max-height: 450px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .message-item {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .highlight {
      background-color: rgba(236, 72, 153, 0.4);
      color: #f472b6;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Contador de Amor ❤️</h1>
      <p class="subtitle">Selecione o arquivo da conversa do WhatsApp (.txt ou .zip)</p>

      <div class="file-dropzone">
        <span id="dropzoneText">📁 Clique ou arraste a conversa aqui</span>
        <input type="file" id="fileInput" accept=".txt,.zip">
      </div>

      <div id="status" class="status-text"></div>

      <div id="resultsContainer" class="results-container">
        <div class="stat-card">
          <div id="totalCount" class="stat-number">0</div>
          <div class="stat-label">Declarações encontradas</div>
        </div>

        <div id="messagesList" class="messages-list"></div>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const dropzoneText = document.getElementById('dropzoneText');
      const resultsContainer = document.getElementById('resultsContainer');
      const messagesList = document.getElementById('messagesList');
      const totalCount = document.getElementById('totalCount');

      dropzoneText.innerText = `📄 ${file.name}`;
      status.innerText = "Processando mensagens...";
      resultsContainer.style.display = "none";
      messagesList.innerHTML = "";

      try {
        let text = "";

        if (file.name.endsWith('.zip')) {
          const zip = new JSZip();
          const zipContent = await zip.loadAsync(file);
          const txtFile = Object.keys(zipContent.files).find(name => name.endsWith('.txt'));
          
          if (!txtFile) {
            status.innerText = "Nenhum arquivo de conversa encontrado no .zip.";
            return;
          }
          text = await zipContent.files[txtFile].async('string');
        } else {
          text = await file.text();
        }

        // REGEX ULTRA PRECISA:
        // Exige limites estritos (\b) e impede que pegue palavras como "amor", "amigo", "cuide"
        
        // 1. "eu te amo" / "te amo" (ex: euuu teee amooo, teee amoo)
        const patternTE_AMO = /\b(?:e+u+[\s,]*)?t+e+[\s,]+a+m+o+\b/gi;
        
        // 2. "amo você" / "amo vc" (ex: amooo vocêee, amoo vccc, amoo vc)
        const patternAMO_VOCE = /\ba+m+o+[\s,]+(?:v+o+c+e+|v+c+)\b/gi;

        const masterRegex = new RegExp(`${patternTE_AMO.source}|${patternAMO_VOCE.source}`, 'gi');

        const lines = text.split('\n');
        let matchesCount = 0;
        let htmlList = "";

        lines.forEach(line => {
          const matchesInLine = line.match(masterRegex);
          if (matchesInLine) {
            matchesCount += matchesInLine.length;
            const highlightedText = line.replace(masterRegex, match => `<span class="highlight">${match}</span>`);
            htmlList += `<div class="message-item">${highlightedText}</div>`;
          }
        });

        status.innerText = "";
        totalCount.innerText = matchesCount;

        if (matchesCount > 0) {
          messagesList.innerHTML = `<h3 style="margin-bottom:15px; font-size:1rem; color:var(--text-muted)">Mensagens encontradas:</h3>` + htmlList;
          resultsContainer.style.display = "block";
        } else {
          status.innerText = "Nenhuma declaração foi encontrada no arquivo.";
        }

      } catch (err) {
        status.innerText = "Erro ao processar o arquivo.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
